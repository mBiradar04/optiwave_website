# Render Blueprint — deploys all three pieces of the site (frontend, backend,
# database) in one go: Render dashboard → "New +" → "Blueprint" → this repo.
#
# NOTE: Render restructured Postgres pricing in April 2026 to bill compute and
# storage separately. If the `plan` / `diskSizeGB` fields below are rejected by
# the Blueprint parser, open the database in Render's UI and set them there
# directly instead — everything else in this file is unaffected.

databases:
  - name: ccsl-db
    databaseName: ccsl
    user: ccsl
    plan: basic
    diskSizeGB: 1
    region: singapore

services:
  # Backend — Django + DRF, serves /api/... and /admin/
  - type: web
    name: ccsl-api
    runtime: python
    plan: starter
    region: singapore
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: ccsl-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: api.optiwavephotonics.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://optiwavephotonics.com,https://www.optiwavephotonics.com

  # Frontend — the built React site, served as static files
  - type: web
    name: ccsl-website
    runtime: static
    region: singapore
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://api.optiwavephotonics.com/api
    routes:
      # SPA fallback so direct links / refreshes on e.g. /products work
      - type: rewrite
        source: /*
        destination: /index.html
